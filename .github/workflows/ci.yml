name: CI — Java Maven + SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requis pour SonarCloud (historique)
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build & Test
        run: mvn -q -B clean verify
      - name: Build summary
        if: always()
        run: |
          echo "### Résumé du build" >> $GITHUB_STEP_SUMMARY
          echo "- Auteur : ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branche : ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Statut : ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
      - name: SonarQube Cloud Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mvn -q -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }}
          else
            mvn -q -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.qualitygate.wait=true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
